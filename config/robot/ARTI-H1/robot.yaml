name: robot

motor_manager_config_file: ../config/robot/ARTI-H1/motor.yaml
sensor_manager_config_file: ../config/robot/ARTI-H1/sensor.yaml
joy_handler_config_file: ../config/robot/ARTI-H1/joy.yaml
urdf_file: ../config/robot/ARTI-H1/robot.urdf
model_file: ../config/robot/ARTI-H1/agent.onnx
# Per-control-step CSV (observation, ONNX q_des / actions, motor states, raw IMU) written to
# <log_file>_YYYYmmdd_HHMMSS.csv; empty string disables it. Send this file when a real run misbehaves.
log_file: ./arti_h1_run

motors:
  - name: left_hip_yaw
    index: 0
  - name: right_hip_yaw
    index: 1
  - name: left_hip_roll
    index: 2
  - name: right_hip_roll
    index: 3
  - name: left_hip_pitch
    index: 4
  - name: right_hip_pitch
    index: 5
  - name: left_knee
    index: 6
  - name: right_knee
    index: 7
  - name: left_ankle_pitch
    index: 8
  - name: right_ankle_pitch
    index: 9
  - name: left_ankle_roll
    index: 10
  - name: right_ankle_roll
    index: 11

sensors:
  - name: imu_body
    index: 0
    frame: pelvis
    # MTi-3 in the pelvis frame (arti_h1_env_cfg.py ARTI_H1_IMU_OFFSET_FROM_PELVIS = trunk 0.28725 + 0.023, x +0.04688).
    translation: [0.04688, 0.0, 0.31025]
    orientation: [0.0, 0.0, 0.0, 1.0]

# Sole centre in each foot link (ARTI_H1_*_FOOT_OFFSET_FROM_FOOT_LINK; the right leg is the left one rotated by pi).
foots:
  - name: left_foot_link
    offset: [-0.026, 0.0, -0.051]
  - name: right_foot_link
    offset: [-0.026, 0.0, -0.051]

# Policy settings; must match the training env. agent.onnx = arti_h1 local L2 agent_60000 (10-28, warm start from L1
# agent_360000 = server 06-44-49 300k + foot width penalty + strong pushes incl. roll / pitch; L2 adds pelvis CoM +-2 cm,
# MTi-3 mount tilt +-0.05 rad + tilt random walk, sagittal pushes +-0.20 m/s). Same gait / commands / limits as run35.
# Previous model: agent_run35_820000.onnx (set model_file to it to go back).
# Test model: agent_L4_240000.onnx = local L4 agent_240000 (L3 + hip_pitch L/R symmetry penalty -100); forward hip_pitch
# L/R 18.5/16.3 deg in sim (L2 21.5/15.0) -> less pitch rocking expected, but weaker vs. front->back pushes. Set model_file to it to try.
# run35 agent_820000 notes: slow careful gait (arti_h1
# reference, 1.5 s cycle, 0.75 s per step), zero command = stand still and balance (clock stops at a rest phase),
# real motor.yaml joint limits, sim-to-real randomisation (MTi-3 IMU model, stale Unitree feedback, joint / IMU
# offsets, ankle_roll delay 10 ms), hip_roll limit +-15 deg, trained on the joint model identified from config/sysid logs (10-23) for the motor.yaml gains Unitree hip
# 2.0 / 0.025, knee 2.5 / 0.025, CubeMars 30 / 0.5. If motor.yaml kp / kd change, re-measure and retrain before walking.
# ONNX: input obs [1, 116]; outputs "actions" (fed back as previous actions) and "q_des" (joint targets, policy order;
# includes the default pose and the nominal gait at the next clock phase, clamped to the training limits).
policy:
  # Gait clock (cycles/s) advanced once per control step; the ONNX q_des already reads the nominal gait one step ahead.
  gait_phase_rate: 0.66667
  control_dt: 0.0166666667
  # Gait clock at the policy start: a rest phase (the robot starts standing; the clock waits there for a command).
  initial_gait_phase: 0.927
  # Pelvis tilt (rad) that counts as a fall: the policy stops and every joint is only damped (kp 0, motor.yaml kd).
  max_tilt: 0.7
  # IMU calibration after standing up (feet on the ground, keep the robot still); imu_still_time 0 = off.
  # 10-28 15:19 observe log: the MTi-3 roll / pitch started 3-4 deg off the accelerometer tilt and needed ~80 s to
  # converge, and the gyro had a constant bias up to 1 deg/s. The gyro bias is averaged over imu_still_time (s) and
  # removed from the observation; then the policy waits until the IMU roll / pitch is within imu_converge_tolerance
  # (deg) of the accelerometer tilt for 1 s, or imu_converge_timeout (s) passes.
  imu_still_time: 10
  imu_converge_tolerance: 0.5
  imu_converge_timeout: 180
  # Attitude used by the policy: 0 = MTi-3 orientation output; > 0 = own filter (bias-corrected gyro + accelerometer,
  # gain in 1/s). 10-28 16:05 walking log: after walking the MTi roll / pitch sat 1.5-3.4 deg off the accelerometer
  # while standing still; the filter at 0.5 kept it within 0.4 deg (offline). Logged as att_q*.
  imu_attitude_gain: 0.5
  # Standing (training cfg gait_rest_phases / stand_command_threshold): under a zero command the clock runs on to the
  # next rest phase and stops there. [] = the clock always runs (run34 and earlier step in place at zero command).
  # run35 (arti_h1 slow gait): gait_phase_rate 0.66667, initial_gait_phase 0.927, gait_rest_phases [0.427, 0.927].
  gait_rest_phases: [0.427, 0.927]
  stand_command_threshold: 0.003
  # |stick| below this is 0, so a released stick gives exactly the zero (standing) command.
  stick_deadzone: 0.1
  # observation command = command * command_scale (command_linear/angular_velocity_scale).
  command_scale: [0.5, 0.5, 0.25]
  # Command at full stick: the training command range (vx m/s, vy m/s, yaw rate rad/s).
  command_max: [0.046, 0.0172, 0.0456]
  # First reference frame (policy / Isaac joint order); the robot moves here after homing before the policy starts.
  default_pose: [0.0, 0.0, 0.0, 0.0, -0.10078, -0.10078, 0.20157, 0.20157, 0.10078, 0.10079, 0.0, 0.0]
  # PD gains while walking: motor.yaml 'kp' / 'kd' of each motor (motor_command_ values, driver units).