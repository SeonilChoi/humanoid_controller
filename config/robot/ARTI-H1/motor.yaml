# kp / kd: PD gains every program sends as motor_command_ kp / kd while it controls the motor (homing uses the
# homing_* gains). DRIVER units: Unitree = rotor side (joint side x gear_ratio^2 = x 40.07), CubeMars MIT = output side.
# min / max: joint limits after homing (rad). The homing side equals homing_offset (the stopper), so no command
# ever pushes past the stopper; the other side is the free end of the joint.
# Branch arti-h1-new-pelvis: hip_pitch / knee / ankle_pitch use the -20/40/-20 URDF zero (was -45/90/-45), same physical
# stoppers: q_new = q_old + (hip_pitch +25, knee -50, ankle_pitch -25 deg), so min / max / homing_offset are shifted.
# 11-13 (user): right-leg zero from the --observe --limp-right report (right-left reading difference, ~2 s averages,
# 5 reports): ids 2/4/6/8/10/12 homing_offset = suggested value; min / max shifted by the same amount (same stoppers).
masters:
  - id: 0
    period: 8000 # microseconds
    type: unitree
    device: /dev/Unitree

    motors:
      - id: 1
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.7056
        max:  0.7056
        homing_direction: 1
        homing_offset: 0.7056
        homing_velocity: 0.3
        homing_kp: 0.3
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.0
        homing_velocity_threshold: 0.1

      - id: 2
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.7301
        max:  0.6811
        homing_direction: 1
        homing_offset: 0.6811
        homing_velocity: 0.3
        homing_kp: 0.3
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.0
        homing_velocity_threshold: 0.1

      - id: 3
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.2854
        max:  0.4
        homing_direction: -1
        homing_offset: -0.2854
        homing_velocity: 0.3
        homing_kp: 0.45    # 11-11: raised with the threshold (stall push ~ kp * 0.15 rad lead)
        homing_kd: 0.025
        homing_zero_kp: 1.2
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.5    # 11-11: raised so friction alone is not taken for the stopper
        homing_velocity_threshold: 0.2

      - id: 4
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.3568
        max:  0.3286
        homing_direction: -1
        homing_offset: -0.3568
        homing_velocity: 0.3
        homing_kp: 0.45    # 11-11: raised with the threshold (stall push ~ kp * 0.15 rad lead)
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.5    # 11-11: raised so friction alone is not taken for the stopper
        homing_velocity_threshold: 0.1

      - id: 5
