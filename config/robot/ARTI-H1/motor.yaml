# kp / kd: PD gains every program sends as motor_command_ kp / kd while it controls the motor (homing uses the
# homing_* gains). DRIVER units: Unitree = rotor side (joint side x gear_ratio^2 = x 40.07), CubeMars MIT = output side.
# min / max: joint limits after homing (rad). The homing side equals homing_offset (the stopper), so no command
# ever pushes past the stopper; the other side is the free end of the joint.
masters:
  - id: 0
    period: 8000 # microseconds
    type: unitree
    device: /dev/Unitree

    motors:
      - id: 1
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
        pulse_per_revolution: 32768
        min: -0.7056
        max:  0.7056
        homing_direction: 1
        homing_offset: 0.7056
        homing_velocity: 0.3
        homing_kp: 0.3
        homing_kd: 0.025
        homing_zero_kp: 1.0
        homing_zero_kd: 0.025
        homing_hold_kp: 0.5
        homing_hold_kd: 0.025
        homing_torque_threshold: 1.0
        homing_velocity_threshold: 0.1

      - id: 2
        gear_ratio: 6.33
        kp: 2.0    # motor_command_ gain while controlling (driver units)
        kd: 0.025
        axis: 1
