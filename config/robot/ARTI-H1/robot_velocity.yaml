name: robot

motor_manager_config_file: ../config/robot/ARTI-H1/motor.yaml
sensor_manager_config_file: ../config/robot/ARTI-H1/sensor.yaml
joy_handler_config_file: ../config/robot/ARTI-H1/joy.yaml
urdf_file: ../config/robot/ARTI-H1/robot.urdf
# Velocity-command policy (no gait clock, no AMP): run with
#   ./ARTI-H1 ../config/robot/ARTI-H1/robot_velocity.yaml
# agent_vel_r21_240000.onnx = NEW PELVIS + NEW JOINT ZERO (branch arti-h1-new-pelvis, 11-12). arti_h1_local
# Template-Arti-H1-Velocity-Direct-v0 (Isaac Lab 3.x / PhysX, skrl PPO), RSI round r21 (logs/rsi/r21; run
# logs/skrl/arti_h1_velocity/2026-11-12_10-36-24_ppo_torch agent_240000), fine-tuned from r20 on the patched USD:
# pelvis hip_yaw mount 280.65 -> 317.07 mm (trunk 0.32367), leg zero -45/90/-45 -> -20/40/-20 deg, so
# q_new = q_old + (hip_pitch +25, knee -50, ankle_pitch -25 deg). motor.yaml homing offsets / limits on this branch
# match that zero: re-home before running, and do NOT run the older (r05-r16) models with this motor.yaml.
# Per-joint zero error randomisation (hip_yaw 0.03, hip_roll 0.06, hip_pitch 0.08, knee 0.08, ankle_pitch 0.20,
# ankle_roll 0.06 rad), yaw-only tracking term, command holds 1.5-5 s, 81-D observation, 5.24 rad/s slew limit,
# delays and target low-pass 0.6.
# Sim eval with joint zero errors: vx 0.65 / vy 0.26 / yaw small 0.80 / large 0.82, 1 fall without pushes (arc),
#   4.7 % kick falls (r16: 7.0 %), fwd-kick falls 9.4 % (r16-r20: ~14 %), tilt rms 3.7 deg.
model_file: ../config/robot/ARTI-H1/agent_vel_r21_240000.onnx
# Per-control-step CSV (observation, ONNX q_des / actions, motor states, raw IMU) written to
# <log_file>_YYYYmmdd_HHMMSS.csv; empty string disables it. Send this file when a real run misbehaves.
log_file: ./arti_h1_vel_run

motors:
  - name: left_hip_yaw
    index: 0
  - name: right_hip_yaw
    index: 1
  - name: left_hip_roll
    index: 2
  - name: right_hip_roll
    index: 3
  - name: left_hip_pitch
    index: 4
  - name: right_hip_pitch
    index: 5
  - name: left_knee
    index: 6
  - name: right_knee
    index: 7
  - name: left_ankle_pitch
    index: 8
  - name: right_ankle_pitch
    index: 9
  - name: left_ankle_roll
    index: 10
  - name: right_ankle_roll
    index: 11

sensors:
  - name: imu_body
    index: 0
    frame: pelvis
    # MTi-3 in the pelvis frame (arti_h1_env_cfg.py ARTI_H1_IMU_OFFSET_FROM_PELVIS = trunk 0.32367 + 0.023, x +0.04688;
    # new pelvis, was trunk 0.28725 -> z 0.31025).
    translation: [0.04688, 0.0, 0.34667]
    orientation: [0.0, 0.0, 0.0, 1.0]

# Sole centre in each foot link (ARTI_H1_*_FOOT_OFFSET_FROM_FOOT_LINK; the right leg is the left one rotated by pi).
foots:
  - name: left_foot_link
    offset: [-0.026, 0.0, -0.051]
  - name: right_foot_link
    offset: [-0.026, 0.0, -0.051]

# Policy settings; must match ArtiH1VelocityEnvCfg.
# ONNX: input obs [1, 81] = pelvis gyro (rad/s, pelvis frame) 3, gravity direction in the pelvis frame 3,
# joint pos - default_pose 12, joint vel 12, actions a(t) 12, a(t-1) 12, a(t-2) 12, last joint target - default_pose 12,
# command (vx m/s, vy m/s, yaw rate rad/s, unscaled) 3;
# outputs "actions" (fed back) and "q_des" (= clamp(default + per-joint scale * actions, real limits, hip_roll +-15 deg)).
# The controller then limits q_des to the previous target +- target_rate_limit * control_dt and sends that.
policy:
  observation: velocity_history
  # rad/s; joint target slew limit (ArtiH1VelocityEnvCfg.target_rate_limit), 0 = off
  target_rate_limit: 5.24
  # joint target low-pass, before the rate limit: target = previous + alpha * (q_des - previous); 1 = off.
  # 11-11 real run without it: 30 Hz joint chatter while standing. Sim r12 with 0.6: 0 falls, chatter 3-5x lower.
  target_lowpass_alpha: 0.6
  control_dt: 0.0166666667
  # no gait clock in this policy (kept for the shared parser; the clock is logged but not observed)
  gait_phase_rate: 0.0
  initial_gait_phase: 0.0
  gait_rest_phases: []
  stand_command_threshold: 0.0
  max_tilt: 0.7
  imu_still_time: 10
  imu_converge_tolerance: 0.5
  imu_converge_timeout: 180
  imu_attitude_gain: 0.5
  imu_stale_time: 0.2
  # IMU stop / motor link fault / joystick lost: the policy stops and every joint holds the last target, moving to the
  # default stance over this many seconds (0 = freeze exactly where it was); the program keeps running and logging
  # (CSV column 'fault': 1 IMU, 2 motor link, 4 joystick, 8 holding) until Ctrl+C. A fall still damps and exits.
  fault_settle_time: 1.0
  # joystick lost: false = only log it, the policy keeps running on the zero command (stands) and walks again after the
  # pad reconnects; true = hold the pose like an IMU / motor fault
  joy_loss_hold: false
  # released stick = exactly the zero command (the policy stands still)
  stick_deadzone: 0.1
  # the velocity env observes the raw command
  command_scale: [1.0, 1.0, 1.0]
  # full stick = training command range: command_linear_x_range 0.15, command_linear_y_range 0.08, command_yaw_range 0.4
  command_max: [0.15, 0.08, 0.4]
  # arti-h1-new-pelvis: -20/40/-20 joint zero (old-zero pose -0.10078 / 0.20157 / 0.10078 + (+25, -50, -25) deg)
  default_pose: [0.0, 0.0, 0.0, 0.0, 0.33555, 0.33555, -0.67109, -0.67109, -0.33555, -0.33554, 0.0, 0.0]
  # PD gains while walking: motor.yaml 'kp' / 'kd' of each motor (motor_command_ values, driver units).
