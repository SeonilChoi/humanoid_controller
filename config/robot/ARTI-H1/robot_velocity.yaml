name: robot

motor_manager_config_file: ../config/robot/ARTI-H1/motor.yaml
sensor_manager_config_file: ../config/robot/ARTI-H1/sensor.yaml
joy_handler_config_file: ../config/robot/ARTI-H1/joy.yaml
urdf_file: ../config/robot/ARTI-H1/robot.urdf
# Velocity-command policy (no gait clock, no AMP): run with
#   ./ARTI-H1 ../config/robot/ARTI-H1/robot_velocity.yaml
# agent_vel_r05_240000.onnx = arti_h1_local Template-Arti-H1-Velocity-Direct-v0 (Isaac Lab 3.x / PhysX, skrl PPO),
# RSI round r05 (11-10, logs/rsi/r05; run logs/skrl/arti_h1_velocity/2026-11-10_00-32-17_ppo_torch agent_240000).
# Sim eval (64 env x 10 s per scenario, every scenario from standstill, PhysX):
#   tracking vx 0.85 / vy 0.45 / yaw small 0.83 / yaw large 0.83 of the command; 0 falls without pushes;
#   gait start from standstill 100 %; zero command = stands still (0 liftoffs);
#   mirror-symmetric foot lift (L vs mirrored R swing peak <= 0.17 cm, mean 0.07 cm), swing peak >= 2.9 cm;
#   sole-centre gap >= 10.5 cm (1st percentile, soles 9 cm wide), sole overlap 0.1 % of steps;
#   0.4 m/s random-direction kicks every 2 s: 3.9 % of envs fell.
# Same sim-to-real setup as the AMP stage-3 models (actuator model from the motor.yaml gains, joint lag, MTi-3 IMU
# model, stale feedback, joint offsets, real joint limits, hip_roll +-15 deg).
model_file: ../config/robot/ARTI-H1/agent_vel_r05_240000.onnx
# Per-control-step CSV (observation, ONNX q_des / actions, motor states, raw IMU) written to
# <log_file>_YYYYmmdd_HHMMSS.csv; empty string disables it. Send this file when a real run misbehaves.
log_file: ./arti_h1_vel_run

motors:
  - name: left_hip_yaw
    index: 0
  - name: right_hip_yaw
    index: 1
  - name: left_hip_roll
    index: 2
  - name: right_hip_roll
    index: 3
  - name: left_hip_pitch
    index: 4
  - name: right_hip_pitch
    index: 5
  - name: left_knee
    index: 6
  - name: right_knee
    index: 7
  - name: left_ankle_pitch
    index: 8
  - name: right_ankle_pitch
    index: 9
  - name: left_ankle_roll
    index: 10
  - name: right_ankle_roll
    index: 11

sensors:
  - name: imu_body
    index: 0
    frame: pelvis
    # MTi-3 in the pelvis frame (arti_h1_env_cfg.py ARTI_H1_IMU_OFFSET_FROM_PELVIS = trunk 0.28725 + 0.023, x +0.04688).
    translation: [0.04688, 0.0, 0.31025]
    orientation: [0.0, 0.0, 0.0, 1.0]

# Sole centre in each foot link (ARTI_H1_*_FOOT_OFFSET_FROM_FOOT_LINK; the right leg is the left one rotated by pi).
foots:
  - name: left_foot_link
    offset: [-0.026, 0.0, -0.051]
  - name: right_foot_link
    offset: [-0.026, 0.0, -0.051]

# Policy settings; must match ArtiH1VelocityEnvCfg.
# ONNX: input obs [1, 45] = pelvis gyro (rad/s, pelvis frame) 3, gravity direction in the pelvis frame 3,
# joint pos - default_pose 12, joint vel 12, previous actions 12, command (vx m/s, vy m/s, yaw rate rad/s, unscaled) 3;
# outputs "actions" (fed back) and "q_des" (= clamp(default + per-joint scale * actions, real limits, hip_roll +-15 deg)).
policy:
  observation: velocity
  control_dt: 0.0166666667
  # no gait clock in this policy (kept for the shared parser; the clock is logged but not observed)
  gait_phase_rate: 0.0
  initial_gait_phase: 0.0
  gait_rest_phases: []
  stand_command_threshold: 0.0
  max_tilt: 0.7
  imu_still_time: 10
  imu_converge_tolerance: 0.5
  imu_converge_timeout: 180
  imu_attitude_gain: 0.5
  imu_stale_time: 0.2
  # released stick = exactly the zero command (the policy stands still)
  stick_deadzone: 0.1
  # the velocity env observes the raw command
  command_scale: [1.0, 1.0, 1.0]
  # full stick = training command range: command_linear_x_range 0.15, command_linear_y_range 0.08, command_yaw_range 0.4
  command_max: [0.15, 0.08, 0.4]
  default_pose: [0.0, 0.0, 0.0, 0.0, -0.10078, -0.10078, 0.20157, 0.20157, 0.10078, 0.10079, 0.0, 0.0]
  # PD gains while walking: motor.yaml 'kp' / 'kd' of each motor (motor_command_ values, driver units).
