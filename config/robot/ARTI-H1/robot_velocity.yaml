name: robot

motor_manager_config_file: ../config/robot/ARTI-H1/motor.yaml
sensor_manager_config_file: ../config/robot/ARTI-H1/sensor.yaml
joy_handler_config_file: ../config/robot/ARTI-H1/joy.yaml
urdf_file: ../config/robot/ARTI-H1/robot.urdf
# Velocity-command policy (no gait clock, no AMP): run with
#   ./ARTI-H1 ../config/robot/ARTI-H1/robot_velocity.yaml
# agent_vel_r16_240000.onnx = arti_h1_local Template-Arti-H1-Velocity-Direct-v0 (Isaac Lab 3.x / PhysX, skrl PPO),
# RSI round r16 (11-11, logs/rsi/r16; run logs/skrl/arti_h1_velocity/2026-11-11_20-51-15_ppo_torch agent_240000),
# fine-tuned from r15 with a yaw-only tracking term (small turns from standstill now start). Same per-joint zero (homing)
# error randomisation as r15 (hip_yaw 0.03, hip_roll 0.06, hip_pitch 0.08, knee 0.08, ankle_pitch 0.15, ankle_roll
# 0.06 rad), command holds 1.5-5 s, 81-D observation, 5.24 rad/s slew limit, delays and target low-pass 0.6.
# Sim eval with joint zero errors: vx 0.63 / vy 0.23 / yaw small 0.84 / large 0.88 (r15: 0.65 / 0.19 / 0.72 / 0.82),
#   0 falls without pushes, 7.0 % kick falls, tilt rms 3.6 deg; +0.1 rad/s turn starts in 100 % of envs (r15: 31 %).
# r15 (agent_vel_r15_240000.onnx): same training without the yaw term; right ankle_pitch -15 deg off -> walking yaw
#   drift +2.2 deg/s (r14: +28 deg/s). r14: no zero-error randomisation (37 falls / 19.5 % kick falls with zero errors).
# Previous models: agent_vel_r15_240000.onnx; agent_vel_r14_240000.onnx (no zero-error randomisation, cleaner tracking in the ideal sim);
# agent_vel_r12_240000.onnx (trained without the low-pass); agent_vel_r05_240000.onnx (45-D, no target_rate_limit).
model_file: ../config/robot/ARTI-H1/agent_vel_r16_240000.onnx
# Per-control-step CSV (observation, ONNX q_des / actions, motor states, raw IMU) written to
# <log_file>_YYYYmmdd_HHMMSS.csv; empty string disables it. Send this file when a real run misbehaves.
log_file: ./arti_h1_vel_run

motors:
  - name: left_hip_yaw
    index: 0
  - name: right_hip_yaw
    index: 1
  - name: left_hip_roll
    index: 2
  - name: right_hip_roll
    index: 3
  - name: left_hip_pitch
    index: 4
  - name: right_hip_pitch
    index: 5
  - name: left_knee
    index: 6
  - name: right_knee
    index: 7
  - name: left_ankle_pitch
    index: 8
  - name: right_ankle_pitch
    index: 9
  - name: left_ankle_roll
    index: 10
  - name: right_ankle_roll
    index: 11

sensors:
  - name: imu_body
    index: 0
    frame: pelvis
    # MTi-3 in the pelvis frame (arti_h1_env_cfg.py ARTI_H1_IMU_OFFSET_FROM_PELVIS = trunk 0.28725 + 0.023, x +0.04688).
    translation: [0.04688, 0.0, 0.31025]
    orientation: [0.0, 0.0, 0.0, 1.0]

# Sole centre in each foot link (ARTI_H1_*_FOOT_OFFSET_FROM_FOOT_LINK; the right leg is the left one rotated by pi).
foots:
  - name: left_foot_link
    offset: [-0.026, 0.0, -0.051]
  - name: right_foot_link
    offset: [-0.026, 0.0, -0.051]

# Policy settings; must match ArtiH1VelocityEnvCfg.
# ONNX: input obs [1, 81] = pelvis gyro (rad/s, pelvis frame) 3, gravity direction in the pelvis frame 3,
# joint pos - default_pose 12, joint vel 12, actions a(t) 12, a(t-1) 12, a(t-2) 12, last joint target - default_pose 12,
# command (vx m/s, vy m/s, yaw rate rad/s, unscaled) 3;
# outputs "actions" (fed back) and "q_des" (= clamp(default + per-joint scale * actions, real limits, hip_roll +-15 deg)).
# The controller then limits q_des to the previous target +- target_rate_limit * control_dt and sends that.
policy:
  observation: velocity_history
  # rad/s; joint target slew limit (ArtiH1VelocityEnvCfg.target_rate_limit), 0 = off
  target_rate_limit: 5.24
  # joint target low-pass, before the rate limit: target = previous + alpha * (q_des - previous); 1 = off.
  # 11-11 real run without it: 30 Hz joint chatter while standing. Sim r12 with 0.6: 0 falls, chatter 3-5x lower.
  target_lowpass_alpha: 0.6
  control_dt: 0.0166666667
  # no gait clock in this policy (kept for the shared parser; the clock is logged but not observed)
  gait_phase_rate: 0.0
  initial_gait_phase: 0.0
  gait_rest_phases: []
  stand_command_threshold: 0.0
  max_tilt: 0.7
  imu_still_time: 10
  imu_converge_tolerance: 0.5
  imu_converge_timeout: 180
  imu_attitude_gain: 0.5
  imu_stale_time: 0.2
  # released stick = exactly the zero command (the policy stands still)
  stick_deadzone: 0.1
  # the velocity env observes the raw command
  command_scale: [1.0, 1.0, 1.0]
  # full stick = training command range: command_linear_x_range 0.15, command_linear_y_range 0.08, command_yaw_range 0.4
  command_max: [0.15, 0.08, 0.4]
  default_pose: [0.0, 0.0, 0.0, 0.0, -0.10078, -0.10078, 0.20157, 0.20157, 0.10078, 0.10079, 0.0, 0.0]
  # PD gains while walking: motor.yaml 'kp' / 'kd' of each motor (motor_command_ values, driver units).
