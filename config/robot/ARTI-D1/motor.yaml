# ARTI-D1: every joint is a Dynamixel X-series servo in Position Control Mode on one bus (IDs 1-14 = robot.yaml
# motor index + 1 = the Isaac Lab arti_d1 joint order). Legs XH540-W270, arms XM430-W350.
# Servo setup before the first run (Dynamixel Wizard): ID, Baud Rate 1 Mbps, Operating Mode 4 (Extended Position), Return Delay
# Time 0 (default 250 us makes one bus cycle ~8 ms longer).
# kp / kd: Position P / D Gain register values written to the servo; P 800 / D 0 is the factory setting and what the
#   arti_d1 training sim models (robots/arti_d1.py). Change them only together with the sim gains.
# zero_offset: motor angle (rad) at the joint zero, motor / gear_ratio = joint * axis + zero_offset; 0 = pulse 0.
#   axis / zero_offset are assembly dependent: check every joint with `ARTI-D1 ... --observe` (the printed motor angle
#   must follow the URDF axis sign and read the default pose when the robot is in it) before enabling the policy.
# Real zero (USER 2026-11-03): every servo reads pulse 0 (the zero the Dynamixel keeps) with the hip link level, each
#   leg straight and vertical, sole flat on the ground = URDF hip_roll +/-0.15, hip_pitch -0.6325, knee +1.3736,
#   ankle -0.7411 rad (motion_generator scripts/view_real_zero.py). zero_offset = -axis * that angle.
#   Operating Mode 4 (Extended Position): the goals go below pulse 0. Present Position restarts inside 0-4095 at
#   power-on (pulse -24 reads 4072); DynamixelDriver unwraps it to the turn of the joint range and adds the turn back
#   to the goals.
#   axis -1 (USER): left_ankle, right_hip_yaw, right_hip_pitch, right_knee, left m7 (ID 5), right_arm_m8.
# min / max: the URDF joint limits (= the training sim limits); goal positions are clamped to them.
# Shoulders: IDs 5 / 7 are the real m7 servos of the 2-DoF 5-bar (the URDF opens it into serial m8 + m8crank_plate
#   joints). ARTI_D1 converts the policy m8crank_plate target to an m7 goal and the m7 reading back to the plate angle
#   (robot/src/robots/ARTI_D1_shoulder.cpp = shoulder_ik.py), so their zero_offset / axis / min / max are m7 ones:
#   m7 = 0 at the CAD pose (m8 = plate = 0), sign about the Fusion m7 axis.
masters:
  - id: 0
    period: 10000 # microseconds; 14 status packets at 1 Mbps need ~5 ms with Return Delay Time 0
    type: dynamixel
    device: /dev/Dynamixel

    motors:
      - id: 1    # left_arm_m8 (XM430-W350)
        gear_ratio: 1.0
        axis: 1
        zero_offset: 0.00000000    # pulse 0 at the real zero
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -1.047198
        max: 0.349066

      - id: 2    # left_hip_yaw (XH540-W270)
        gear_ratio: 1.0
        axis: 1    # USER 2026-11-03 (passive check): + by hand read -, so not reversed
        zero_offset: 0.00000000    # pulse 0 at the real zero
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -0.523599
        max: 0.523599

      - id: 3    # right_arm_m8 (XM430-W350)
        gear_ratio: 1.0
        axis: -1    # real servo turns opposite to the URDF axis (USER 2026-11-03)
        zero_offset: 0.00000000    # pulse 0 at the real zero
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -1.047198
        max: 0.349066

      - id: 4    # right_hip_yaw (XH540-W270)
        gear_ratio: 1.0
        axis: -1    # real servo turns opposite to the URDF axis (USER 2026-11-03)
        zero_offset: 0.00000000    # pulse 0 at the real zero
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -0.523599
        max: 0.523599

      - id: 5    # left shoulder m7 (XM430-W350); policy joint left_arm_m8crank_plate via ARTI_D1_shoulder
        gear_ratio: 1.0
        axis: -1    # real servo turns opposite to the URDF axis (USER 2026-11-03)
        zero_offset: 0.00000000    # pulse 0 at the real zero
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -0.349066   # real m7 limits (shoulder_ik.py M7_LIMITS: -20 / 75 deg)
        max: 1.308997

      - id: 6    # left_hip_roll (XH540-W270)
        gear_ratio: 1.0
        axis: 1
        zero_offset: -0.15000000    # pulse 0 at the real zero, URDF left_hip_roll = +0.1500 rad
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -0.314159
        max: 0.209440

      - id: 7    # right shoulder m7 (XM430-W350); policy joint right_arm_m8crank_plate via ARTI_D1_shoulder
        gear_ratio: 1.0
        axis: 1
        zero_offset: 0.00000000    # pulse 0 at the real zero
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -1.308997   # real m7 limits (shoulder_ik.py M7_LIMITS: -75 / 20 deg)
        max: 0.349066

      - id: 8    # right_hip_roll (XH540-W270)
        gear_ratio: 1.0
        axis: 1
        zero_offset: 0.15000000    # pulse 0 at the real zero, URDF right_hip_roll = -0.1500 rad
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -0.209440
        max: 0.314159

      - id: 9    # left_hip_pitch (XH540-W270)
        gear_ratio: 1.0
        axis: 1
        zero_offset: 0.63250800    # pulse 0 at the real zero, URDF left_hip_pitch = -0.6325 rad
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -1.156110
        max: 0.781209

      - id: 10    # right_hip_pitch (XH540-W270)
        gear_ratio: 1.0
        axis: -1    # real servo turns opposite to the URDF axis (USER 2026-11-03)
        zero_offset: -0.63250800    # pulse 0 at the real zero, URDF right_hip_pitch = -0.6325 rad
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -1.156110
        max: 0.781209

      - id: 11    # left_knee (XH540-W270)
        gear_ratio: 1.0
        axis: 1
        zero_offset: -1.37357500    # pulse 0 at the real zero, URDF left_knee = +1.3736 rad
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -0.354302
        max: 1.548110

      - id: 12    # right_knee (XH540-W270)
        gear_ratio: 1.0
        axis: -1    # real servo turns opposite to the URDF axis (USER 2026-11-03)
        zero_offset: 1.37357500    # pulse 0 at the real zero, URDF right_knee = +1.3736 rad
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -0.354302
        max: 1.548110

      - id: 13    # left_ankle (XH540-W270)
        gear_ratio: 1.0
        axis: -1    # real servo turns opposite to the URDF axis (USER 2026-11-03)
        zero_offset: -0.74106700    # pulse 0 at the real zero, URDF left_ankle = -0.7411 rad
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -1.805650
        max: 0.568000

      - id: 14    # right_ankle (XH540-W270)
        gear_ratio: 1.0
        axis: 1
        zero_offset: 0.74106700    # pulse 0 at the real zero, URDF right_ankle = -0.7411 rad
        pulse_per_revolution: 4096
        kp: 800
        kd: 0
        min: -1.805650
        max: 0.568000
