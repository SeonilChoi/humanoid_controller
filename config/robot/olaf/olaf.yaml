name: olaf

motor_manager_config_file: ../config/hardware/motor/olaf.yaml
sensor_manager_config_file: ../config/hardware/sensor/xsens_mti.yaml

urdf_file: ../config/robot/olaf/olaf.urdf

joints:
  - left_hip_yaw
  - left_hip_roll
  - left_hip_pitch
  - left_knee
  - left_ankle_pitch
  - left_ankle_roll
  - right_hip_yaw
  - right_hip_roll
  - right_hip_pitch
  - right_knee
  - right_ankle_pitch
  - right_ankle_roll

sensors:
  imu:
    name: body
    frame: pelvis

    translation: [-0.04688, 0.0, 0.31825]
    orientation: [1.0, 0.0, 0.0, 0.0]

frames:
  left_foot: left_foot_link
  right_foot: right_foot_link

toe_offset:
  left: [0.026, 0.0, -0.051]
  right: [0.026, 0.0, -0.051]