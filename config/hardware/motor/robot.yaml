masters:
  - id: 0
    period: 1000 # microseconds
    type: unitree
    device: /dev/Unitree

    motors:
      - index: 0
        id: 0
        gear_ratio: 6.33
        zero_offset: 0.0
        pulse_per_revolution: 32768

      - index: 1
        id: 1
        gear_ratio: 6.33
        zero_offset: 0.0
        pulse_per_revolution: 32768

  - id: 1
    period: 1000
    type: cubemars
    device: can1

    motors:
      - index: 2
        id: 1
        gear_ratio: 36.0
        zero_offset: 0.0
        pulse_per_revolution: 65536

      - index: 3
        id: 2
        gear_ratio: 36.0
        zero_offset: 0.0
        pulse_per_revolution: 65536

  - id: 2
    period: 1000 # microseconds
    type: dynamixel
    device: /dev/Dynamixel

    motors:
      - index: 4
        id: 1
        gear_ratio: 1.0
        zero_offset: 0.0
        pulse_per_revolution: 4096

      - index: 5
        id: 2
        gear_ratio: 1.0
        zero_offset: 0.0
        pulse_per_revolution: 4096