masters:
  - id: 0
    period: 1000 # microseconds
    type: dynamixel
    device: /dev/Dynamixel

    motors:
      - index: 0
        id: 1
        gear_ratio: 1.0
        zero_offset: 0.0
        pulse_per_revolution: 4096

      - index: 1
        id: 2
        gear_ratio: 1.0
        zero_offset: 0.0
        pulse_per_revolution: 4096
